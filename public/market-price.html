<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>市场价查询 · 各城市各平台原始价格</title><style>
:root{--green:#07c160;--blue:#1989fa;--orange:#ff9f43;--bg:#f5f6f8;--card:#fff;--line:#ebeef5;--text:#1f2329;--sub:#8a8f99;}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}
body{background:var(--bg);color:var(--text);font-size:14px;padding:16px;max-width:1180px;margin:0 auto;}
.nav{display:flex;gap:6px;align-items:center;margin-bottom:12px;flex-wrap:wrap;}
.nav .brand{font-weight:700;color:var(--text);margin-right:10px;font-size:15px;}
.nav a{font-size:13px;color:var(--sub);text-decoration:none;padding:6px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;font-weight:600;transition:all .15s;}
.nav a:hover{border-color:var(--green);color:var(--green);}
.nav a.on{background:var(--green);color:#fff;border-color:var(--green);}
.topbar h1{font-size:20px}.topbar .hint{color:var(--sub);font-size:12px;margin-top:4px;line-height:1.5;}
.controls{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;background:var(--card);border-radius:10px;padding:12px 14px;margin:12px 0;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.ctl{display:flex;flex-direction:column;gap:4px;}.ctl label{font-size:12px;color:var(--sub);}
.ctl select{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;outline:none;min-width:150px;background:#fff;}
.ctl select:focus{border-color:var(--green);}
.summary{display:flex;gap:12px;margin:14px 0;flex-wrap:wrap;}
.stat{flex:1;min-width:120px;background:var(--card);border-radius:10px;padding:12px 14px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.stat .n{font-size:22px;font-weight:600}.stat .l{color:var(--sub);font-size:12px;margin-top:2px;}
.note{font-size:12px;color:var(--sub);background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0 0 14px;line-height:1.7;}
.note b{color:var(--text);}
.filters{background:var(--card);border-radius:10px;padding:12px 14px;margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.filters input,.filters select{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;outline:none;}
.filters input:focus,.filters select:focus{border-color:var(--green);}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;}
.pcard-full{border:1px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden;display:flex;flex-direction:column;}
.pc-head{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line);background:#fafbfc;}
.dot{width:9px;height:9px;border-radius:50%;flex:none;}
.pc-name{font-weight:600;font-size:14px;}
.pc-cnt{color:var(--sub);font-size:12px;margin-left:2px;}
.pc-status{margin-left:auto;font-size:11px;padding:1px 8px;border-radius:8px;}
.b-ok{background:#e8f8ee;color:#07a050;}.b-none{background:#f0f0f0;color:#888;}
.pc-body{max-height:460px;overflow-y:auto;}
.ptable{width:100%;border-collapse:collapse;font-size:13px;}
.ptable th{position:sticky;top:0;background:#fafbfc;color:var(--sub);font-weight:500;font-size:12px;text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);}
.ptable td{padding:8px 12px;border-bottom:1px solid #f2f3f5;vertical-align:top;}
.ptable tr:last-child td{border-bottom:none;}
.pname{font-weight:500;}.pcat{color:var(--sub);font-size:11px;margin-top:2px;}
.pprice{font-weight:700;color:#e4393c;font-size:14px;white-space:nowrap;}
.pprice .u{font-size:11px;font-weight:400;color:var(--sub);margin-left:2px;}
.pprice .kg{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-top:2px;}
.ptime{color:var(--sub);font-size:12px;white-space:nowrap;}
.empty{color:var(--sub);padding:24px;text-align:center;font-size:13px;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#323233;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center;}
.toast.show{opacity:1;}
.btn-refresh{border:1px solid var(--green);background:#fff;color:var(--green);border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;font-weight:600;align-self:flex-end;min-width:96px;}
.btn-refresh:hover{background:#f0fbf4;}.btn-refresh:disabled{opacity:.6;cursor:default;}
.btn-export{border:1px solid var(--green);background:#fff;color:var(--green);border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;font-weight:600;align-self:flex-end;min-width:96px;}
.btn-export:hover{background:#f0fbf4;}
/* ---- 价格预警 / 图表分析（手风琴面板）---- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden;}
.panel-h{display:flex;align-items:center;gap:8px;padding:11px 14px;cursor:pointer;user-select:none;background:#fafbfc;}
.panel-h:hover{background:#f4f6f8;}
.panel-h .ph-title{font-weight:600;font-size:14px;}
.panel-h .arrow{color:var(--sub);font-size:11px;transition:transform .2s;}
.panel.open .arrow{transform:rotate(90deg);}
.panel-b{display:none;padding:12px 14px;border-top:1px solid var(--line);}
.panel.open .panel-b{display:block;}
.badge{font-size:11px;padding:1px 8px;border-radius:8px;background:#fdecea;color:#e4393c;font-weight:600;}
.badge.zero{background:#f0f0f0;color:#888;}
.ctl-inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:12px;color:var(--sub);}
.ctl-inline select{border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12px;outline:none;background:#fff;color:var(--text);}
.ctl-inline select:focus{border-color:var(--green);}
.alert-list{display:flex;flex-direction:column;}
.alert-row{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #f2f3f5;font-size:13px;flex-wrap:wrap;}
.alert-row:last-child{border-bottom:none;}
.a-tag{flex:none;font-size:11px;padding:2px 8px;border-radius:8px;font-weight:600;margin-top:1px;}
.a-tag.spread{background:#fff4e8;color:#d48806;}
.a-tag.up{background:#fdecea;color:#e4393c;}
.a-tag.down{background:#e8f8ee;color:#07a050;}
.a-name{font-weight:600;min-width:90px;}
.a-cat{color:var(--sub);font-weight:400;font-size:11px;margin-left:4px;}
.a-detail{color:var(--sub);flex:1;min-width:220px;line-height:1.5;}
.a-val{font-weight:600;white-space:nowrap;}
.a-val.up{color:#e4393c;}.a-val.down{color:#07a050;}.a-val.spread{color:#d48806;}
.warn-tag{display:inline-block;font-size:10px;padding:0 6px;border-radius:6px;margin-left:6px;font-weight:600;vertical-align:1px;}
.warn-tag.spread{background:#fff4e8;color:#d48806;}
.warn-tag.up{background:#fdecea;color:#e4393c;}
.warn-tag.down{background:#e8f8ee;color:#07a050;}
.charts{display:flex;gap:14px;flex-wrap:wrap;}
.chart-box{flex:1;min-width:320px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;}
.chart-box h4{font-size:13px;font-weight:600;margin-bottom:8px;}
.chart-box svg{width:100%;height:auto;display:block;}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--sub);margin-top:6px;}
.legend span{display:inline-flex;align-items:center;gap:4px;}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block;}
.no-data-tip{color:var(--sub);font-size:12px;padding:8px 0;}
</style></head><body>
<div class="nav">
  <span class="brand">价格采集系统</span>
  <a href="./index.html">价格采集</a>
  <a href="./market-price.html" class="on">市场价查询</a>
</div>
<div class="topbar"><div><h1>市场价查询</h1><div class="hint" id="hint">加载中…</div></div></div>
<div class="controls">
  <div class="ctl"><label>城市</label><select id="fCity"></select></div>
  <div class="ctl"><label>数据日期</label><select id="fDate"></select></div>
  <button id="btnRefresh" class="btn-refresh">刷新缓存</button><button id="btnExport" class="btn-export">导出 Excel</button>
</div>
<div class="summary">
  <div class="stat"><div class="n" id="s-plat">0</div><div class="l">平台数</div></div>
  <div class="stat"><div class="n" id="s-prod">0</div><div class="l">商品种类（全市）</div></div>
  <div class="stat"><div class="n" id="s-date">—</div><div class="l">数据日期</div></div>
</div>
<div class="note" id="note">本页仅展示各城市、各平台采集到的<b>原始价格</b>，不做基准商品映射、不做跨平台比价。数据与「价格采集」共用（同一份静态数据，由后端发布）。</div>
<div class="filters">
  <input id="fKw" placeholder="搜索商品名称…" style="width:200px">
  <select id="fCat"><option value="">全部分类</option></select>
  <span id="fHit" style="color:var(--sub);font-size:12px"></span>
</div>
<div class="panel" id="alertPanel">
  <div class="panel-h" id="alertHead"><span class="arrow">▶</span><span class="ph-title">价格预警</span><span class="badge zero" id="alertBadge">0</span></div>
  <div class="panel-b">
    <div class="ctl-inline">
      跨平台价差 ≥ <select id="thSpread"><option value="1.2">1.2 倍</option><option value="1.5" selected>1.5 倍</option><option value="2">2 倍</option></select>
      环比波动 ≥ <select id="thChange"><option value="10">10%</option><option value="20" selected>20%</option><option value="30">30%</option></select>
      <span id="alertCompare" style="margin-left:auto"></span>
    </div>
    <div class="alert-list" id="alertList"></div>
  </div>
</div>
<div class="panel" id="chartPanel">
  <div class="panel-h" id="chartHead"><span class="arrow">▶</span><span class="ph-title">图表分析</span></div>
  <div class="panel-b">
    <div class="charts">
      <div class="chart-box"><h4>分类均价（元/斤）</h4><div id="catChart"></div></div>
      <div class="chart-box"><h4>商品价格走势（元/斤）</h4>
        <div class="ctl-inline" style="margin-bottom:6px"><select id="trendProd" style="min-width:200px"></select></div>
        <div id="trendChart"></div>
      </div>
    </div>
  </div>
</div>
<div class="cards" id="cards"></div>
<div class="toast" id="toast"></div>
<script src="./static-data.js"></script>
<script src="./xlsx.full.min.js"></script>
<script src="./export-excel.js"></script>
<script>
const $=s=>document.querySelector(s);
let DATA=null, currentCity=null, currentDate=null;

function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600);}

async function boot(){
  const cached=window.PriceStatic.readCache();
  if(cached&&cached.snaps){
    DATA=cached;initCities();
    $('#hint').innerHTML+=' <span style="color:var(--sub)">（本地缓存 · '+cached.generated_at+'）</span>';
  }
  try{
    const d=await window.PriceStatic.fetchLatest();
    const changed=!cached||d.generated_at!==cached.generated_at;
    DATA=d;initCities();
    if(changed&&cached)toast('数据已更新至 '+d.generated_at);
  }catch(e){
    if(!cached)$('#hint').textContent='加载数据失败：'+e.message+'（请通过本地服务器或已部署站点访问，勿用 file:// 直接打开）';
    else toast('获取最新数据失败，显示本地缓存');
  }
}

async function refreshCache(){
  const btn=$('#btnRefresh');if(btn.disabled)return;const old=btn.textContent;btn.disabled=true;btn.textContent='刷新中…';
  try{const d=await window.PriceStatic.fetchLatest();DATA=d;initCities();toast('本地缓存已更新（生成于 '+d.generated_at+'）');}
  catch(e){toast('刷新失败：'+e.message);}finally{btn.disabled=false;btn.textContent=old;}
}
$('#btnRefresh').onclick=refreshCache;
$('#btnExport').onclick=exportMarket;

// ---- 价格预警 / 图表分析 ----
let ALERT_MAP={};        // 商品名 -> 预警列表
let alertAutoOpened=false;
let trendProd=null;      // 走势图当前选中商品
$('#alertHead').onclick=()=>$('#alertPanel').classList.toggle('open');
$('#chartHead').onclick=()=>$('#chartPanel').classList.toggle('open');
$('#thSpread').onchange=render;
$('#thChange').onchange=render;
$('#trendProd').onchange=e=>{trendProd=e.target.value;renderCharts();};

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function platInfo(pid){return (DATA&&DATA.platforms||[]).find(z=>z.id===pid);}
function platName(pid){const x=platInfo(pid);return x?x.name:pid;}
function platColor(pid){const x=platInfo(pid);return (x&&x.color)||'#999';}
function getPrevDate(){
  const dates=(DATA&&DATA.dates&&DATA.dates[currentCity])||[];
  const i=dates.indexOf(currentDate);
  return (i>=0&&i<dates.length-1)?dates[i+1]:null;
}
// 预警计算：跨平台价差（最高价/最低价 ≥ 阈值） + 环比波动（对上一存档日期，均价变化 ≥ 阈值）
function computeAlerts(snap, prevSnap, thSpread, thChange){
  const out=[];
  if(!snap) return out;
  let prevAvg={};
  if(prevSnap){
    for(const it of (prevSnap.canonical||[])){
      const pp=(it.prices||[]).filter(p=>p.price>0);
      if(pp.length) prevAvg[it.name]=pp.reduce((s,p)=>s+p.price,0)/pp.length;
    }
  }
  const prevD=getPrevDate();
  for(const item of (snap.canonical||[])){
    const ps=(item.prices||[]).filter(p=>p.price>0);
    if(ps.length>=2){
      let lo=ps[0],hi=ps[0];
      for(const p of ps){ if(p.price<lo.price)lo=p; if(p.price>hi.price)hi=p; }
      if(lo.price>0 && hi.price/lo.price>=thSpread){
        out.push({type:'spread',name:item.name,cat1:item.cat1,pct:(hi.price/lo.price-1)*100,
          detail:esc(platName(hi.pid))+' ¥'+hi.price.toFixed(2)+' ↔ '+esc(platName(lo.pid))+' ¥'+lo.price.toFixed(2)+'（共 '+ps.length+' 个平台）'});
      }
    }
    if(ps.length && prevAvg[item.name]>0){
      const cur=ps.reduce((s,p)=>s+p.price,0)/ps.length;
      const chg=(cur-prevAvg[item.name])/prevAvg[item.name]*100;
      if(Math.abs(chg)>=thChange){
        out.push({type:chg>0?'up':'down',name:item.name,cat1:item.cat1,pct:Math.abs(chg),
          detail:'均价 ¥'+cur.toFixed(2)+' ← 上期（'+(prevD||'')+'）¥'+prevAvg[item.name].toFixed(2)});
      }
    }
  }
  return out.sort((a,b)=>b.pct-a.pct);
}
function renderAlerts(alerts){
  const badge=$('#alertBadge');
  badge.textContent=alerts.length;
  badge.className='badge'+(alerts.length?'':' zero');
  const prevD=getPrevDate();
  $('#alertCompare').textContent=prevD?('环比：'+prevD+' → '+(currentDate||'')):'该城市暂无上一期存档，仅启用跨平台价差预警';
  const list=$('#alertList');
  if(!alerts.length){
    list.innerHTML='<div class="no-data-tip">✓ 当前筛选范围内无触发预警的商品</div>';
    return;
  }
  list.innerHTML=alerts.map(a=>{
    const cls=a.type;
    const tag=a.type==='spread'?'跨平台价差':(a.type==='up'?'环比上涨':'环比下跌');
    const val=(a.type==='up'?'+':a.type==='down'?'-':'+')+Math.round(a.pct)+'%';
    return `<div class="alert-row">
      <span class="a-tag ${cls}">${tag}</span>
      <span class="a-name">${esc(a.name)}<span class="a-cat">${esc(a.cat1||'')}</span></span>
      <span class="a-detail">${a.detail}</span>
      <span class="a-val ${cls}">${val}</span>
    </div>`;
  }).join('');
}
function warnTagHtml(name){
  const list=ALERT_MAP[name];
  if(!list||!list.length) return '';
  const a=list.find(x=>x.type==='up'||x.type==='down')||list[0];
  const cls=a.type;
  const txt=a.type==='spread'?('价差+'+Math.round(a.pct)+'%'):((a.type==='up'?'↑':'↓')+Math.round(a.pct)+'%');
  const title=a.type==='spread'?'跨平台价差异警':(a.type==='up'?'较上一期上涨':'较上一期下跌');
  return `<span class="warn-tag ${cls}" title="${title}">${txt}</span>`;
}
// ---- 图表（手写 SVG，无外部依赖）----
function renderCharts(){
  const snap=(DATA&&DATA.snaps&&DATA.snaps[currentCity]&&DATA.snaps[currentCity][currentDate])||null;
  renderCatChart(snap);
  renderTrendChart();
}
function catAvg(snap){
  const acc={};
  for(const it of (snap.canonical||[])){
    const ps=(it.prices||[]).filter(p=>p.price>0);
    if(!ps.length) continue;
    const c=it.cat1||'其他';
    if(!acc[c]) acc[c]={sum:0,n:0};
    ps.forEach(p=>{acc[c].sum+=p.price;acc[c].n++;});
  }
  return Object.entries(acc).map(([cat,v])=>({cat,avg:v.sum/v.n,n:v.n})).sort((a,b)=>b.avg-a.avg);
}
function renderCatChart(snap){
  const box=$('#catChart');
  if(!snap){box.innerHTML='<div class="no-data-tip">暂无数据</div>';return;}
  const rows=catAvg(snap).slice(0,10);
  if(!rows.length){box.innerHTML='<div class="no-data-tip">暂无数据</div>';return;}
  const W=460,rowH=28,barH=14,L=80,R=70,T=6;
  const H=T+rows.length*rowH+6;
  const max=Math.max(...rows.map(r=>r.avg));
  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  rows.forEach((r,i)=>{
    const y=T+i*rowH;
    const bw=Math.max(2,(W-L-R)*r.avg/max);
    const name=r.cat.length>6?r.cat.slice(0,5)+'…':r.cat;
    s+=`<text x="${L-8}" y="${y+rowH/2+4}" text-anchor="end" font-size="12" fill="#1f2329">${esc(name)}</text>`;
    s+=`<rect x="${L}" y="${y+rowH/2-barH/2}" width="${bw.toFixed(1)}" height="${barH}" rx="3" fill="#07c160" opacity="0.85"/>`;
    s+=`<text x="${(L+bw+6).toFixed(1)}" y="${y+rowH/2+4}" font-size="11" fill="#8a8f99">¥${r.avg.toFixed(2)}·${r.n}条</text>`;
  });
  box.innerHTML=s+'</svg>';
}
function renderTrendChart(){
  const sel=$('#trendProd'), box=$('#trendChart');
  const dates=[...((DATA.dates&&DATA.dates[currentCity])||[])].reverse(); // 升序
  const snaps=(DATA.snaps&&DATA.snaps[currentCity])||{};
  const prodMap={}; // 商品名 -> pid -> {date:price}
  dates.forEach(d=>{
    const sn=snaps[d]; if(!sn) return;
    for(const it of (sn.canonical||[])){
      for(const p of (it.prices||[])){
        if(!(p.price>0)) continue;
        const m=prodMap[it.name]=prodMap[it.name]||{};
        const s=m[p.pid]=m[p.pid]||{};
        s[d]=p.price;
      }
    }
  });
  const names=Object.keys(prodMap).filter(n=>{
    const ds=new Set();
    Object.values(prodMap[n]).forEach(s=>Object.keys(s).forEach(k=>ds.add(k)));
    return ds.size>=2; // 优先有 2 期以上数据的商品
  }).sort((a,b)=>a.localeCompare(b,'zh'));
  if(!trendProd||!names.includes(trendProd)) trendProd=names[0]||null;
  sel.innerHTML=names.slice(0,300).map(n=>{
    const cov=new Set();
    Object.values(prodMap[n]).forEach(s=>Object.keys(s).forEach(k=>cov.add(k)));
    return `<option value="${esc(n)}"${n===trendProd?' selected':''}>${esc(n)}（${cov.size} 期）</option>`;
  }).join('');
  if(!trendProd){box.innerHTML='<div class="no-data-tip">该城市暂无跨期商品数据</div>';return;}
  const series=prodMap[trendProd];
  const pids=Object.keys(series);
  const allVals=[];
  pids.forEach(pid=>dates.forEach(d=>{const v=series[pid][d];if(v!=null)allVals.push(v);}));
  if(!allVals.length){box.innerHTML='<div class="no-data-tip">暂无数据</div>';return;}
  const W=460,H=240,L=46,R=12,T=12,B=26,iw=W-L-R,ih=H-T-B;
  let vmin=Math.min(...allVals),vmax=Math.max(...allVals);
  if(vmin===vmax){vmin*=0.9;vmax*=1.1;}else{const pad=(vmax-vmin)*0.15;vmin=Math.max(0,vmin-pad);vmax+=pad;}
  const X=i=>dates.length===1?L+iw/2:L+iw*i/(dates.length-1);
  const Y=v=>T+ih*(1-(v-vmin)/(vmax-vmin));
  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  for(let g=0;g<=4;g++){
    const v=vmin+(vmax-vmin)*g/4,y=Y(v);
    s+=`<line x1="${L}" y1="${y.toFixed(1)}" x2="${W-R}" y2="${y.toFixed(1)}" stroke="#ebeef5" stroke-width="1"/>`;
    s+=`<text x="${L-6}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="10" fill="#8a8f99">${v.toFixed(2)}</text>`;
  }
  dates.forEach((d,i)=>{s+=`<text x="${X(i).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="10" fill="#8a8f99">${d.slice(5)}</text>`;});
  pids.forEach(pid=>{
    const color=platColor(pid);
    const seg=dates.map((d,i)=>({x:X(i),v:series[pid][d]})).filter(p=>p.v!=null).map(p=>({x:p.x,y:Y(p.v)}));
    if(seg.length>1) s+=`<polyline points="${seg.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ')}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>`;
    seg.forEach(p=>{s+=`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="#fff" stroke="${color}" stroke-width="2"/>`;});
  });
  box.innerHTML=s+'</svg><div class="legend">'+pids.map(pid=>`<span><i style="background:${platColor(pid)}"></i>${esc(platName(pid))}</span>`).join('')+'</div>';
}

function initCities(){
  const sel=$('#fCity'); sel.innerHTML='';
  (DATA.cities||[]).forEach(c=>{
    const o=document.createElement('option'); o.value=c.id; o.textContent=c.name; sel.appendChild(o);
  });
  sel.onchange=()=>selectCity(sel.value);
  $('#fDate').onchange=()=>selectDate($('#fDate').value);
  $('#fKw').oninput=render;
  $('#fCat').onchange=render;
  if(DATA.cities&&DATA.cities.length) selectCity(DATA.cities[0].id);
  else $('#hint').textContent='暂无城市数据';
}

function selectCity(city){
  currentCity=city;
  const dates=(DATA.dates&&DATA.dates[city])||[];
  const sel=$('#fDate'); sel.innerHTML='';
  dates.forEach(d=>{const o=document.createElement('option');o.value=d;o.textContent=d;sel.appendChild(o);});
  if(dates.length) selectDate(dates[0]);
  else { currentDate=null; $('#hint').textContent='该城市暂无存档数据'; render(); }
}

function selectDate(d){
  currentDate=d;
  const snap=(DATA.snaps&&DATA.snaps[currentCity]&&DATA.snaps[currentCity][d])||null;
  const meta=snap&&snap.meta||{};
  const built=meta.built_at||'';
  $('#hint').textContent='数据日期 '+d+(built?(' ｜ 本地构建 '+built):'');
  render();
}

function platRows(pid, snap){
  if(!snap) return [];
  const out=[];
  for(const item of (snap.canonical||[])){
    const pr=(item.prices||[]).find(x=>x.pid===pid);
    if(!pr) continue;
    out.push({name:item.name, cat1:item.cat1||'其他', price:pr.price, kg:pr.kg, spec:pr.spec, time:pr.time});
  }
  return out;
}

function render(){
  const snap=(DATA&&DATA.snaps&&DATA.snaps[currentCity]&&DATA.snaps[currentCity][currentDate])||null;
  const plats=(DATA.platforms||[]).filter(p=>p.city===currentCity);
  const source=(snap&&snap.meta&&snap.meta.source)||{};
  // 价格预警：先算好，供面板与表格标签共用
  const prevSnap=getPrevDate()?(DATA.snaps[currentCity][getPrevDate()]||null):null;
  const alerts=computeAlerts(snap, prevSnap, parseFloat($('#thSpread').value), parseFloat($('#thChange').value));
  ALERT_MAP={};
  alerts.forEach(a=>{(ALERT_MAP[a.name]=ALERT_MAP[a.name]||[]).push(a);});
  renderAlerts(alerts);
  if(alerts.length&&!alertAutoOpened){$('#alertPanel').classList.add('open');alertAutoOpened=true;}
  // 汇总
  $('#s-plat').textContent=plats.length;
  $('#s-prod').textContent=snap?(snap.canonical||[]).length:0;
  $('#s-date').textContent=currentDate||'—';
  // 分类下拉
  const cats=new Set(); if(snap)(snap.canonical||[]).forEach(i=>cats.add(i.cat1||'其他'));
  const fcat=$('#fCat'); const cur=fcat.value;
  fcat.innerHTML='<option value="">全部分类</option>'+[...cats].sort().map(c=>`<option value="${c}">${c}</option>`).join('');
  if([...cats].includes(cur)) fcat.value=cur; else fcat.value='';
  const kw=$('#fKw').value.trim();
  const cat=fcat.value;
  // 平台卡片
  const cards=$('#cards'); cards.innerHTML='';
  let totalHit=0;
  plats.forEach(p=>{
    let rows=platRows(p.id, snap).filter(r=>{
      if(kw && !r.name.includes(kw)) return false;
      if(cat && r.cat1!==cat) return false;
      return true;
    });
    totalHit+=rows.length;
    const st=source[p.id]||{};
    const card=document.createElement('div'); card.className='pcard-full';
    const statusHtml = st.ok!==false
      ? (rows.length? '' : '<span class="pc-status b-none">空</span>')
      : '<span class="pc-status b-none">无数据</span>';
    const bodyHtml = rows.length
      ? `<table class="ptable"><thead><tr><th>商品</th><th>价格</th><th>规格</th><th>报价时间</th></tr></thead><tbody>${
          rows.map(r=>`<tr>
            <td><div class="pname">${r.name}${warnTagHtml(r.name)}</div><div class="pcat">${r.cat1}</div></td>
            <td class="pprice">¥${Number(r.price).toFixed(2)}<span class="u">元/斤</span>${
              r.kg!=null?`<span class="kg">¥${Number(r.kg).toFixed(2)} 元/公斤</span>`:''}</td>
            <td>${r.spec||'—'}</td>
            <td class="ptime">${r.time||'—'}</td>
          </tr>`).join('')
        }</tbody></table>`
      : '<div class="empty">该平台暂无数据</div>';
    card.innerHTML=`<div class="pc-head">
        <span class="dot" style="background:${p.color||'#999'}"></span>
        <span class="pc-name">${p.name}</span>
        <span class="pc-cnt">${rows.length} 种</span>${statusHtml}
      </div><div class="pc-body">${bodyHtml}</div>`;
    cards.appendChild(card);
  });
  if(!plats.length) cards.innerHTML='<div class="empty">该城市未配置平台</div>';
  $('#fHit').textContent = (kw||cat) ? ('匹配 '+totalHit+' 条') : '';
  renderCharts();
}

function cityName(c){const x=(DATA&&DATA.cities||[]).find(z=>z.id===c);return x?x.name:c;}
// ---- 导出：市场价查询（当前城市 + 筛选结果，跨平台展平）----
function exportMarket(){
  const snap=(DATA&&DATA.snaps&&DATA.snaps[currentCity]&&DATA.snaps[currentCity][currentDate])||null;
  if(!snap){toast('暂无数据可导出');return;}
  const plats=(DATA.platforms||[]).filter(p=>p.city===currentCity);
  const kw=$('#fKw').value.trim();
  const cat=$('#fCat').value;
  const headers=['平台','商品名称','类别','价格(元/斤)','原始(元/公斤)','规格','报价时间'];
  const rows=[];
  plats.forEach(p=>{
    let rs=platRows(p.id,snap).filter(r=>{
      if(kw&&!r.name.includes(kw))return false;
      if(cat&&r.cat1!==cat)return false;
      return true;
    });
    rs.forEach(r=>{
      rows.push({'平台':p.name,'商品名称':r.name,'类别':r.cat1||'其他','价格(元/斤)':Number(r.price).toFixed(2),'原始(元/公斤)':r.kg!=null?Number(r.kg).toFixed(2):'','规格':r.spec||'','报价时间':r.time||''});
    });
  });
  if(!rows.length){toast('当前筛选无数据可导出');return;}
  window.HouchuExport.exportTable(headers,rows,'市场价_'+cityName(currentCity)+'_'+(currentDate||'')+'.xlsx');
  toast('已导出 '+rows.length+' 条');
}

boot();
</script>
</body></html>
